# Run ONCE to create the signing key for the personal build. It produces a short-lived artifact with
# two values to copy into repository secrets, then delete the artifact. Keep the key forever: an APK
# signed with a different key cannot update the installed app.
name: Personal keystore (run once)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    if: github.repository_owner != 'ProdigyV21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate
        run: |
          umask 077
          mkdir out
          pass="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)"
          keytool -genkeypair -v -keystore personal.jks -storetype PKCS12 \
            -alias personal -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$pass" -keypass "$pass" \
            -dname "CN=ARVIO G personal build" >/dev/null 2>&1
          base64 -w0 personal.jks > out/KEYSTORE_BASE64.txt
          printf '%s' "$pass" > out/KEYSTORE_PASSWORD.txt
          cp personal.jks out/personal.jks
          cat > out/README.txt <<'EOF'
          1. In the repository: Settings > Secrets and variables > Actions > New repository secret.
          2. Create KEYSTORE_BASE64 with the whole content of KEYSTORE_BASE64.txt.
          3. Create KEYSTORE_PASSWORD with the content of KEYSTORE_PASSWORD.txt.
          4. Keep personal.jks and the password in your password manager as a backup.
          5. Delete this artifact from the workflow run page.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: personal-keystore
          path: out/
          retention-days: 1
