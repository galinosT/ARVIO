# Personal build of this fork: builds a signed sideload APK and publishes it as a GitHub release,
# which Obtainium (and the app's own updater) pick up. Upstream files are not edited in Git:
# personal/personalize.py adjusts the fresh checkout right before Gradle.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   TMDB_API_KEY, TRAKT_CLIENT_ID, TRAKT_CLIENT_SECRET   your own API credentials
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD                   created by the first run (artifact "personal-keystore")
name: Personal build

on:
  workflow_dispatch:
  push:
    branches: [galinos]
    paths-ignore: ["**.md", "docs/**", "web/**", "netlify-*/**"]

concurrency:
  group: personal-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.repository_owner != 'ProdigyV21'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Check secrets
        id: secrets
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          missing=""
          for v in TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "keystore=missing" >> "$GITHUB_OUTPUT"
            missing="$missing KEYSTORE_BASE64 KEYSTORE_PASSWORD"
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      # First run only: create the signing key and hand it over as a short-lived artifact.
      - name: Create signing key
        if: steps.secrets.outputs.keystore == 'missing'
        run: |
          umask 077
          mkdir keystore-out
          pass="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
          keytool -genkeypair -keystore personal.jks -storetype PKCS12 \
            -alias personal -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$pass" -keypass "$pass" \
            -dname "CN=GMC personal build" >/dev/null 2>&1
          base64 -w0 personal.jks > keystore-out/KEYSTORE_BASE64.txt
          printf '%s' "$pass" > keystore-out/KEYSTORE_PASSWORD.txt
          cp personal.jks keystore-out/personal.jks
          printf '%s\n' \
            "1. Repository Settings > Secrets and variables > Actions > New repository secret." \
            "2. KEYSTORE_BASE64 = the whole content of KEYSTORE_BASE64.txt" \
            "3. KEYSTORE_PASSWORD = the content of KEYSTORE_PASSWORD.txt" \
            "4. Keep personal.jks and the password in your password manager. Never lose them:" \
            "   a build signed with another key cannot update the installed app." \
            "5. Delete this artifact from the run page." > keystore-out/README.txt

      - name: Upload signing key
        if: steps.secrets.outputs.keystore == 'missing'
        uses: actions/upload-artifact@v4
        with:
          name: personal-keystore
          path: keystore-out/
          retention-days: 1

      - name: Stop until secrets are set
        if: steps.secrets.outputs.missing != ''
        run: |
          echo "::error::Add these repository secrets, then run the build again:${{ steps.secrets.outputs.missing }}"
          exit 1

      - name: Write build credentials
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Start from the repository defaults, then put the personal API credentials first.
          {
            echo "TMDB_API_KEY=$TMDB_API_KEY"
            echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID"
            echo "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET"
            grep -vE '^(TMDB_API_KEY|TRAKT_CLIENT_ID|TRAKT_CLIENT_SECRET)=' secrets.defaults.properties
          } > secrets.properties
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/personal.jks"
          {
            echo "storeFile=$RUNNER_TEMP/personal.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=personal"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Personalize
        id: personal
        env:
          PERSONAL_BUILD: ${{ github.run_number }}
        run: python3 personal/personalize.py

      - name: Build signed APK
        run: ./gradlew :app:assembleSideloadRelease --no-daemon

      - name: Collect APK
        id: apk
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/sideload/release/*.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "::error::Expected one APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          out="gmc-${{ steps.personal.outputs.version }}.apk"
          cp "${apks[0]}" "$out"
          # Fail if the APK ended up debug-signed: it could never update the installed app.
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$out" | tee certs.txt
          if grep -qi "Android Debug" certs.txt; then
            echo "::error::APK is debug-signed; check KEYSTORE_BASE64/KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.personal.outputs.version }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          gh release create "v$VERSION" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GMC $VERSION" \
            --notes "Personal build of $(git log -1 --format='%h %s')."
