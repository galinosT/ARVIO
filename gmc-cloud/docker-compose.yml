# GMC Cloud on the OVH VPS. Lives in ~/docker/gmc-cloud next to a checkout of galinosT/ARVIO.
# Caddy (stremio-stack) reaches the backend by name on the shared network; the host port is
# bound to 127.0.0.1 only, for local checks.
name: gmc-cloud
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gmc
      POSTGRES_USER: gmc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmc -d gmc"]
      interval: 10s
      retries: 10
    mem_limit: 512m
    networks: [internal]

  gmc-cloud:
    build:
      context: ${ARVIO_SRC:-../../ARVIO}
      dockerfile: gmc-cloud/Dockerfile
    image: gmc-cloud:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://gmc:${POSTGRES_PASSWORD}@db:5432/gmc
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8790:8790"
    mem_limit: 512m
    networks: [internal, caddy]

  # The ARVIO web dashboard, hosted mode, signed in against GMC Cloud. Caddy sends
  # /.netlify/functions/*, /tv, /assets/*, /delete* and /healthz to gmc-cloud, everything else here.
  dashboard:
    build:
      context: ${ARVIO_SRC:-../../ARVIO}
      dockerfile: gmc-cloud/dashboard.Dockerfile
      args:
        BACKEND_URL: ${PUBLIC_URL:-https://gmc.projectneverland.gr}/.netlify/functions
        APP_ANON_KEY: ${APP_ANON_KEY}
    image: gmc-dashboard:local
    restart: unless-stopped
    environment:
      APP_ANON_KEY: ${APP_ANON_KEY}
      # The proxy routes only use an https backend, so server-side calls go out by the public name.
      NETLIFY_BACKEND_URL: ${PUBLIC_URL:-https://gmc.projectneverland.gr}/.netlify/functions
    volumes:
      - ./dashboard-data:/app/.data
    ports:
      - "127.0.0.1:8791:3000"
    mem_limit: 768m
    networks: [internal, caddy]

networks:
  internal: {}
  caddy:
    external: true
    name: stremio-stack_stremio-net
